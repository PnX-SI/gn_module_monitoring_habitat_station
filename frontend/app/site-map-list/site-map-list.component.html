<div id="cover-spin" *ngIf="!dataLoaded"></div>
<div class="row row-0">
  <div class="card col-xs-12 col-sm-12 col-md-6 col-lg-6 padding-sm tab-container list-shs">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="card-title">Liste des stations</h4>
      <button class="btn btn-sm btn-success pull-right box-shadow" (click)="onNewTransect()" *ngIf="addIsAllowed">
        <i class="fa fa-plus-circle" aria-hidden="true"> </i>
        Ajouter un nouveau transect
      </button>
    
    </div>
    <div class="card-body">
      <fieldset>
        <legend class="filters-legend">
          <h6><i class="fa fa-filter"></i> Filtres</h6>
        </legend>
        <form *ngIf="dataLoaded" class="wrapper wrapper-filter">
          <div class="row">
            <div class="searchSite col">
              <div class="form-row">
                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 ">
                  <small> {{ 'Releve.MinDate' | translate }} : </small>
                  <div class="input-group">
                    <input
                      [formControl]="filterForm.controls.date_low"
                      [maxDate]="maxDate"
                      class="form-control form-control-sm"
                      ngbDatepicker
                      #low="ngbDatepicker"
                      (click)="low.toggle(); $event.stopPropagation()"
                      (document:click)="closeFix($event, low)"
                    />
                    <div class="input-group-append">
                      <button
                        class="btn btn-sm btn-outline-secondary"
                        (click)="low.toggle(); $event.stopPropagation()"
                        (document:click)="closeFix($event, low)"
                        type="button"
                      >
                        <i class="fa fa-calendar"></i>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6">
                  <small> {{ 'Releve.MaxDate' | translate }} : </small>
                  <div class="input-group">
                    <input
                      [formControl]="filterForm.controls.date_up"
                      [minDate]="minDate"
                      class="form-control form-control-sm"
                      ngbDatepicker
                      #up="ngbDatepicker"
                      (click)="up.toggle(); $event.stopPropagation()"
                      (document:click)="closeFix($event, up)"
                    />
                    <div class="input-group-append">
                      <button
                        class="btn btn-sm btn-outline-secondary"
                        (click)="up.toggle(); $event.stopPropagation()"
                        (document:click)="closeFix($event, up)"
                        type="button"
                      >
                        <i class="fa fa-calendar"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="searchSite col">
              <small> Habitat : </small>
              <select
                class="form-control form-control-sm"
                name="selectHab"
                [formControl]="filterForm.controls.filterHab"
              >
                <option [ngValue]="null"> -- Sélectionnez un filtre -- </option>
                <option
                  *ngFor="let hab of tabHab"
                  [ngValue]="hab.cd_hab"
                  [innerHTML]="hab.nom_habitat"
                >
                </option>
              </select>
            </div>
          </div>
          <button class="btn btn-sm btn-success pull-right " (click)="onFilter()">Filtrer</button>
          <button class="btn btn-sm btn-secodary pull-right mr-3" (click)="resetFilters()">
            Réinitialiser
          </button>
        </form>
      </fieldset>
      <br />
      <div class="wrapper wrapper-datatable mt-3" style="box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 6px; overflow: hidden;">
       <table mat-table
            [dataSource] = "dataSource" multiTemplateDataRows
            class = "mat-elevation-28">
            <ng-container matColumnDef="{{column}}" *ngFor="let column of columnsToDisplay">
              <th mat-header-cell *matHeaderCellDef class = "mat-header-cell"> {{column}} </th>
              <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
            </ng-container>
            <ng-container matColumnDef="expand">
              <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button aria-label="expand row" matTooltip="Voir les transects" (click)="(expandedElement = expandedElement === element ? null : element); $event.stopPropagation(); onViewStation(element.id_station)" >
                  <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
                  <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
                </button>
              </td>
            </ng-container>
            <ng-container matColumnDef="expandedDetail">
                <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
                    <div class= "element_detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
                        <!-- sous-table des transects -->
                         <table class = "table">
                            <thead class="sub-table-header">
                              <tr>
                                <th scope = "col">Nom transect</th>
                                <th scope = "col">Nb visites</th>
                                <th scope = "col">Dernières visites</th>
                                <th scope = "col">Actions</th>
                              </tr>
                            </thead>
                            <tbody class = "sub-table-body">
                              <tr *ngFor = "let transect of expandedStations[element.id_station]">
                                <th scope="row">{{transect.transect_label}}</th>
                                <td>{{transect.nb_visits}}</td>
                                <td>{{transect.last_visit}}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-info" (click)="onInfo(transect.id_base_site)" matTooltip="Info transect">
                                        <i class="fa fa-info-circle"></i>
                                    </button>
                                </td>
                              </tr>
                            </tbody>
                         </table>
                    </div>
                </td>
            </ng-container>
             <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"
             class = "mat-header-row"></tr>
              <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand;"
                  class="example-element-row"
                  [class.example-expanded-row]="expandedElement === element"
                  (click)="expandedElement = expandedElement === element ? null : element">
              </tr>
              <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
             
       </table>

       
      </div>
    </div>
    
  </div>
  <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6 padding-sm">
    <pnx-map height="91vh" [center]="center" [zoom]="zoom">
      <pnx-geojson [onEachFeature]="onEachFeature.bind(this)" [geojson]="sites"> </pnx-geojson>
    </pnx-map>
  </div>
</div>
